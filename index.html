led on me\n[02:04.86]Don me (ain\u0027t) -don me (yeah) -don me\n[02:07.94]Don me, called on me (like I got three strikes)\n[02:11.04]Don me (ain\u0027t) -don me (yeah) -don me\n[02:13.71]Don me, called on me, called on me\n[02:16.79]Don me (ain\u0027t) -don me (yeah) -don me\n[02:19.75]Don me, called on me (like I got three strikes) called on me\n[02:23.60](Ain\u0027t) -don me (yeah) -don me\n[02:26.03]Don me, called on me, called on me\n[02:28.99]Don me (ain\u0027t) -don me (yeah) -don me\n[02:31.81]Don me, called on me (like I got three strikes)\n[02:34.97]Don me (ain\u0027t) -don me (yeah) -don me\n[02:37.95]Don me, called on me, called on me\n[02:40.96]Don me (ain\u0027t) -don me (yeah) -don me\n[02:44.13]Don me, called on me (like I got three strikes) called on me\n[02:47.05]Like I got three strikes\n[02:48.03]Like I got three strikes\n[02:49.42]Like I got three strikes\n[02:51.24]Like I got three strikes\n[02:53.00]"};

    function zyoParseLrcText(text) {
        const decodeArea = document.createElement('textarea');
        decodeArea.innerHTML = String(text || '');
        const normalizedText = decodeArea.value
            .replace(/\\r\\n/g, '\n')
            .replace(/\\n/g, '\n')
            .replace(/\\r/g, '\n')
            .replace(/\r\n/g, '\n')
            .replace(/\r/g, '\n')
            .replace(/\s*(?=\[(?:(?:\d{1,2}:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?)\])/g, '\n')
            .trim();
        const lines = normalizedText.split(/\r?\n/);
        const rawEntries = [];

        function decodeLyric(value) {
            decodeArea.innerHTML = value;
            return decodeArea.value;
        }

        lines.forEach((line) => {
            const matches = [...line.matchAll(/\[(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?\]/g)];
            if (!matches.length) return;

            const lyric = decodeLyric(line.replace(/\[(?:(?:\d{1,2}:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?)\]/g, '').trim());
            if (!lyric) return;

            matches.forEach((match) => {
                const hours = Number(match[1] || 0);
                const minutes = Number(match[2] || 0);
                const seconds = Number(match[3] || 0);
                const fraction = Number(String(match[4] || '0').padEnd(3, '0').slice(0, 3)) / 1000;
                rawEntries.push({ time: (hours * 3600) + (minutes * 60) + seconds + fraction, text: lyric });
            });
        });

        return rawEntries
            .sort((a, b) => a.time - b.time);
    }

    function zyoSetCurrentAudioLyrics(track) {
        window.zyoCurrentAudioLyrics = zyoParseLrcText(track?.lyrics?.synced || track?.synced || '');
        window.zyoCurrentAudioLyricsActiveIndex = null;
        zyoRenderAudioLyricsDisplay();
        zyoUpdateAudioLyricsDisplay(0);
    }

    function zyoAudioLyricsSlotCount() {
        return Math.max(3, Number(window.zyoAudioLyricsVisibleSlots || 3));
    }

    function zyoRenderAudioLyricsDisplay() {
        const display = document.querySelector('[data-audio-lyrics-display]');
        const list = display?.querySelector('[data-lyrics-list]');
        if (!display || !list || !Array.isArray(window.zyoCurrentAudioLyrics)) return;

        const slotCount = zyoAudioLyricsSlotCount();
        list.innerHTML = '';
        const spacer = document.createElement('p');
        spacer.className = 'lyrics_line is-spacer';
        spacer.dataset.lyricsIndex = '-2';
        spacer.textContent = '\u00a0';
        list.appendChild(spacer);

        const intro = document.createElement('p');
        intro.className = 'lyrics_line is-symbol';
        intro.dataset.lyricsIndex = '-1';
        intro.textContent = '♪';
        list.appendChild(intro);

        window.zyoCurrentAudioLyrics.forEach((line, index) => {
            const item = document.createElement('p');
            item.className = 'lyrics_line';
            item.dataset.lyricsIndex = String(index);
            item.textContent = line.text;
            list.appendChild(item);
        });
        list.style.setProperty('--lyrics-visible-slots', String(slotCount));
    }

    function zyoUpdateAudioLyricsDisplay(currentTime) {
        if (!window.zyoAudioLyricsEnabled || !Array.isArray(window.zyoCurrentAudioLyrics)) return;

        const display = document.querySelector('[data-audio-lyrics-display]');
        if (!display) return;

        const lines = window.zyoCurrentAudioLyrics;
        let activeIndex = -1;
        if (lines[0]?.time <= currentTime + 0.08) {
            activeIndex = 0;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].time <= currentTime + 0.08) {
                    activeIndex = i;
                } else {
                    break;
                }
            }
        }

        display.hidden = false;
        const list = display.querySelector('[data-lyrics-list]');
        if (list) {
            const slotCount = zyoAudioLyricsSlotCount();
            if (list.children.length !== lines.length + 2) {
                zyoRenderAudioLyricsDisplay();
            }

            const activeLineIndex = activeIndex < 0 ? -1 : activeIndex;
            const activeDomIndex = activeLineIndex + 2;
            const activePosition = activeLineIndex < 0 ? 0 : Math.floor(slotCount / 2);
            const rowHeight = Number(getComputedStyle(display).getPropertyValue('--lyrics-row-height').replace('px', '')) || 24;
            const rowGap = Number(getComputedStyle(display).getPropertyValue('--lyrics-row-gap').replace('px', '')) || 8;
            const targetTop = Math.max(0, (activeDomIndex * (rowHeight + rowGap)) - (activePosition * (rowHeight + rowGap)));

            if (window.zyoCurrentAudioLyricsActiveIndex === activeIndex && list.style.transform === `translateY(-${targetTop}px)`) return;
            window.zyoCurrentAudioLyricsActiveIndex = activeIndex;

            list.querySelectorAll('.lyrics_line').forEach((line) => {
                const lineIndex = Number(line.dataset.lyricsIndex || 0);
                const isActive = lineIndex === activeLineIndex;
                line.classList.toggle('is-active', isActive);
                line.classList.toggle('is-near', !isActive);
                line.classList.toggle('is-hidden-spacer', lineIndex === -2);
            });
            list.style.transform = `translateY(-${targetTop}px)`;
            return;
        }

        const previous = display.querySelector('[data-lyrics-prev]');
        const current = display.querySelector('[data-lyrics-current]');
        const next = display.querySelector('[data-lyrics-next]');
        if (previous) previous.textContent = lines[activeIndex - 1]?.text || '';
        if (current) current.textContent = lines[activeIndex]?.text || '';
        if (next) next.textContent = lines[activeIndex + 1]?.text || '';
    }

    zyoSetCurrentAudioLyrics({ lyrics: window.zyoInitialAudioLyrics });
</script>

<script>
    function createSlider(sliderId, sliderValueId, unit) {
        var slider = document.getElementById(sliderId);
        var sliderInput = document.getElementById(sliderValueId);

        var startValue = sliderInput.value ? Number(sliderInput.value) : 0;

        noUiSlider.create(slider, {
            start: startValue,
            connect: [true, false],
            step: 1,
            range: {
                'min': 0,
                'max': 100
            },
            format: {
                to: function (value) {
                    return value + unit;
                },
                from: function (value) {
                    return Number(value.replace(unit, ''));
                }
            }
        });

        let isSliding = false;

        slider.noUiSlider.on('update', function (values, handle) {
            const valueInt = values[handle];
            sliderInput.value = valueInt.replace(unit, '');
        });
    }

                    window.turnstile.execute(widgetId);
                } catch (error) {
                    finish(reject, error);

    function zyoNormalizeAnalyticsEndpoint(rawEndpoint) {
        const value = String(rawEndpoint || '').trim();
        if (!value) {
            return '/php/api/analytics_event';

        try {
            const url = new URL(value, window.location.origin);

    function zyoSendAnalyticsBatch(events, useBeacon = false) {
        if (!Array.isArray(events) || events.length === 0 || !navigator.sendBeacon && !window.fetch) {

        const payload = JSON.stringify({

        const analyticsEndpoint = zyoNormalizeAnalyticsEndpoint(zyoAnalyticsConfig.endpoint);
        if (!analyticsEndpoint) return;

        if (useBeacon && navigator.sendBeacon) {
            const blob = new Blob([payload], { type: 'application/json' });

    function zyoQueueAnalyticsEvent(eventType, targetType = '', targetId = '', metadata = {}, flushDelay = 3500) {
        if (!zyoAnalyticsConfig.signatures[eventType]) {

        }

        const safeTargetId = String(targetId || '').slice(0, 180);
        const key = zyoAnalyticsEventKey(eventType, targetType, safeTargetId);
        if (zyoAnalyticsTrackedKeys.has(key)) {
            return;
        }
        zyoAnalyticsTrackedKeys.add(key);

        const current = zyoAnalyticsQueue.get(key);
        if (current) {
            return;
        }

        zyoAnalyticsQueue.set(key, {
            event_type: eventType,
            target_type: String(targetType || '').slice(0, 60),
            target_id: safeTargetId,
            event_count: 1,
            metadata: metadata || {}
        });

        if (zyoAnalyticsQueue.size >= 20) {
            zyoFlushAnalyticsQueue(false);
            return;
        }

        if (flushDelay <= 0) {
            zyoFlushAnalyticsQueue(false);
            return;
        }

        if (!zyoAnalyticsFlushTimer) {
            zyoAnalyticsFlushTimer = setTimeout(() => zyoFlushAnalyticsQueue(false), flushDelay);
        }

    function zyoTrackAnalyticsLink(targetElement, targetType = 'link') {

            const hiddenText = targetElement.matches('.svg_text, .socialText, .social_text')
                ? targetElement
                : sourceElement.querySelector('.svg_text, .socialText, .social_text');
            const onclickValue = [
                targetElement.getAttribute('onclick'),
                sourceElement.getAttribute('onclick')
            ].filter(Boolean).join(' ');
            const popupLink = onclickValue.match(/openPopupPreview\(['"](.+?)['"]\)/);
            href = targetElement.dataset.analyticsHref
                || targetElement.dataset.socialUrl
                || sourceElement.dataset.analyticsHref
                || sourceElement.dataset.socialUrl
                || (popupLink ? popupLink[1] : '')
                || targetElement.getAttribute('data-tippy-content')
                || sourceElement.getAttribute('data-tippy-content')
                || (hiddenText ? hiddenText.textContent : '')
                || '';
        }

        href = String(href).trim();
        if (!href || href.startsWith('#') || href.startsWith('javascript:')) {
            return;
        }

        const isDiscordProfile = href.includes('discord.com/users/');
        const widget = zyoAnalyticsWidgetFromElement(targetElement);
        const finalTargetType = widget && targetType === 'link' ? 'widget_link' : targetType;
        zyoTrackAnalyticsEvent(isDiscordProfile ? 'discord_profile_click' : 'link_click', finalTargetType, href, {

        function zyoUpdateGithubContributionScale(root = document) {
            root.querySelectorAll?.('.github_contrib_graph').forEach((graph) => {
                const scaleTarget = graph.querySelector('.github_contrib_graph_scale');
                if (!scaleTarget) {
                    return;
                }

                window.requestAnimationFrame(() => {
                    const fullWidth = scaleTarget.scrollWidth;
                    const availableWidth = graph.clientWidth;
                    const scale = fullWidth > 0 && availableWidth > 0 ? Math.min(1, availableWidth / fullWidth) : 1;
                    graph.style.setProperty('--github-contrib-scale', String(Math.max(.55, scale)));
                });
            });
        }

        function zyoUpdateWidgetDescriptionMarquee(root = document) {
            root.querySelectorAll?.(zyoWidgetMarqueeSelector()).forEach((container) => {
                const content = zyoWidgetMarqueeContent(container);
                if (!content) {
                    return;
                }

                window.requestAnimationFrame(() => {
                    const inlineMaxWidth = content.style.maxWidth;
                    content.style.maxWidth = 'none';
                    const contentWidth = content.scrollWidth;
                    content.style.maxWidth = inlineMaxWidth;
                    const overflowOffset = Math.ceil(contentWidth - container.clientWidth);
                    if (overflowOffset <= 0) {
                        if (container.classList.contains('is-marquee')) {
                            container.classList.remove('is-marquee');
                        }
                        container.style.setProperty('--overflow-offset', '0px');
                        return;
                    }

                    container.style.setProperty('--overflow-offset', `${overflowOffset}px`);
                    container.style.setProperty('--widget-marquee-duration', '8s');
                    if (!container.classList.contains('is-marquee')) {
                        container.classList.add('is-marquee');
                    }
                });
            });

            zyoUpdateGithubContributionScale(root);
        }

        function zyoObserveWidgetDescriptionMarquee(root = document) {
            if (!window.ResizeObserver) {
                return;
            }

            if (!window.zyoWidgetDescriptionResizeObserver) {
                window.zyoWidgetDescriptionResizeObserver = new ResizeObserver((entries) => {
                    window.zyoWidgetDescriptionResizeQueue = window.zyoWidgetDescriptionResizeQueue || new Set();

                    entries.forEach((entry) => {
                        const target = entry.target;
                        const container = target.matches?.(zyoWidgetMarqueeSelector())
                            ? target
                            : target.closest?.(zyoWidgetMarqueeSelector());

                        if (container) {
                            window.zyoWidgetDescriptionResizeQueue.add(container);
                        }
                    });

                    window.cancelAnimationFrame(window.zyoWidgetDescriptionResizeFrame);
                    window.zyoWidgetDescriptionResizeFrame = window.requestAnimationFrame(() => {
                        window.zyoWidgetDescriptionResizeQueue.forEach((container) => {
                            zyoUpdateWidgetDescriptionMarquee(container.parentElement || container);
                        });
                        window.zyoWidgetDescriptionResizeQueue.clear();
                    });
                });
            }

            root.querySelectorAll?.(zyoWidgetMarqueeSelector()).forEach((container) => {
                if (container.dataset.widgetMarqueeObserved === '1') {
                    return;
                }

                const content = zyoWidgetMarqueeContent(container);
                window.zyoWidgetDescriptionResizeObserver.observe(container);
                if (content) {
                    window.zyoWidgetDescriptionResizeObserver.observe(content);
                }
                container.dataset.widgetMarqueeObserved = '1';
            });

            root.querySelectorAll?.('.github_contrib_graph').forEach((graph) => {
                if (graph.dataset.githubContribObserved === '1') {

                window.zyoWidgetDescriptionResizeObserver.observe(graph);

        function zyoFormatDiscordActivityElapsed(totalSeconds) {
            const seconds = Math.max(0, Math.floor(totalSeconds));
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remainingSeconds = seconds % 60;
            const pad = (value) => String(value).padStart(2, '0');

            return `${pad(hours)}:${pad(minutes)}:${pad(remainingSeconds)}`;
        }

        function zyoUpdateDiscordActivityTimers(root = document) {

                text.textContent = zyoFormatDiscordActivityElapsed((Date.now() / 1000) - startedAt);

        function zyoActivateInjectedReveal(root) {
            if (!root) {

            }

            const reveals = [];

            if (root.classList && root.classList.contains('reveal')) {
                reveals.push(root);

            root.querySelectorAll?.('.reveal').forEach((item) => {

            window.requestAnimationFrame(() => {
                window.requestAnimationFrame(() => {

        function zyoHydrateInjectedBioBlock(root) {
            if (!root) {

            }

            zyoActivateInjectedReveal(root);
            zyoObserveWidgetDescriptionMarquee(root);
            zyoUpdateWidgetDescriptionMarquee(root);
            zyoUpdateDiscordActivityTimers(root);
            zyoStartDiscordActivityTimers();
            if (typeof window.zyoInitWidgetClocks === 'function') {

            if (typeof window.zyoInitBioTilt === 'function') {

        function zyoReplaceWithAsyncFallback(slot) {
            const fallbackTemplate = slot?.querySelector?.('template[data-bio-async-fallback]');
            const replacement = fallbackTemplate?.content?.firstElementChild?.cloneNode(true);
            if (!replacement) {
                slot?.remove();
                return null;
            }

            slot.replaceWith(replacement);
            zyoHydrateInjectedBioBlock(replacement);
            return replacement;

        function zyoBioFetchJson(url, payload, timeoutMs = 9000) {
            const controller = typeof window.AbortController === 'function'
                ? new window.AbortController()
                : null;
            const timeout = window.setTimeout(() => controller?.abort(), timeoutMs);

            return fetch(url, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload),
                signal: controller?.signal,
            }).then((response) => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            }).finally(() => {
                window.clearTimeout(timeout);
            });
        }

	            if (!data.html) {
	                throw new Error('Missing Discord presence HTML');

	            const template = document.createElement('template');
	            template.innerHTML = data.html.trim();
	            const replacement = template.content.firstElementChild;
	            if (!replacement) {
	                throw new Error('Invalid Discord presence HTML');
	            }

	            slot.replaceWith(replacement);
	            zyoHydrateInjectedBioBlock(replacement);
	            if (window.tippy && typeof window.tippy === 'function') {

	                    ? [replacement, ...replacement.querySelectorAll('[data-tippy-content]')]

	                    if (item._tippy) {
	                        item._tippy.destroy();

	                    window.tippy(item, {

	                        maxWidth: '92vw',
	                        animation: 'scale',

	                .catch(() => {
	                    if (attempt < 2) {
	                        window.setTimeout(() => {
	                            loadDiscordPresence(attempt + 1);
	                        }, 350 * (attempt + 1));
